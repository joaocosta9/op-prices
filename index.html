<style>/* Shop floor, not a browser tab: fluorescent light, one thumb, glare on the phone. Ink on paper
   reads better there than a dark UI, and colour is spent only on the buy/skip signal. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#fff; --ink:#14161a; --rule:#e4e6eb; --mute:#6b7280; --sunk:#f5f6f8;
  --gain:#0a7d3c; --loss:#c0252b; --focus:#1f4fd8;
  color-scheme:light;
}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.tab{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

header{position:sticky;top:0;z-index:5;background:var(--paper);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--rule)}
.find{display:flex;gap:6px}
#q{flex:1;min-width:0;padding:10px 12px;font-size:17px;font-weight:600;letter-spacing:.02em;
  background:var(--sunk);color:var(--ink);border:1.5px solid transparent;border-radius:9px;outline:none}
#q::placeholder{color:#9aa1ad;font-weight:400;letter-spacing:0}
#q:focus{border-color:var(--focus);background:var(--paper)}
#tag{width:104px;padding:10px 10px;font-size:17px;font-weight:700;text-align:right;
  background:var(--sunk);color:var(--ink);border:1.5px solid transparent;border-radius:9px;outline:none}
#tag:focus{border-color:var(--focus);background:var(--paper)}
#tag::placeholder{color:#9aa1ad;font-weight:400}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:6px;font-size:11px;color:var(--mute)}
.sub input{width:52px;padding:2px 5px;font-size:11px;text-align:right;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:5px}

main{padding:0 12px}
.note{padding:9px 2px 3px;font-size:12px;color:var(--mute)}
.note b{color:var(--ink);font-weight:600}

/* One card = one hairline-separated block. No boxes: boxes waste 8px a side and you want rows. */
.card{border-bottom:1px solid var(--rule);padding:9px 0}
.top{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:inherit}
.id{min-width:0;flex:1}
.num{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--mute);letter-spacing:.02em}
.name{display:block;font-size:14px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{text-align:right;flex-shrink:0}
.yen{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.eur{display:block;font-size:11px;color:var(--mute);margin-top:1px}

.runs{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.run{display:flex;align-items:center;gap:8px;padding:4px 7px;background:var(--sunk);border-radius:6px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--mute);
  min-width:42px;text-align:center}
.rv{font-size:13px;font-weight:600}
.re{font-size:10.5px;color:var(--mute)}
.margin{margin-left:auto;font-size:13px;font-weight:700}
.up{color:var(--gain)}.down{color:var(--loss)}
.only{color:var(--mute);font-size:11.5px;margin-top:4px}

.empty{padding:40px 6px;color:var(--mute);font-size:14px;line-height:1.6}
.more{padding:12px 2px 0;font-size:12px;color:var(--mute)}
a{color:inherit}
@media (prefers-reduced-motion:no-preference){.card{transition:background .12s}}
.top:active{background:var(--sunk)}
</style>

const SEARCH_URL="https://www.cardmarket.com/en/OnePiece/Products/Search?searchString="
// DATA rows: [num, numKey, name, trend, avg30, low, code]
const FEE = 0.95
const q = document.getElementById('q')
const tag = document.getElementById('tag')
const fx = document.getElementById('fx')
const out = document.getElementById('out')

// OCR and fast thumbs confuse these. A swap is only accepted if it lands on a real card number,
// so a misread shows nothing rather than quietly pricing the wrong card.
const SWAP = { O: '0', 0: 'O', I: '1', 1: 'I', L: '1', S: '5', 5: 'S', B: '8', 8: 'B', Z: '2', 2: 'Z' }

const NUMS = new Set(DATA.map(r => r[1]))
const nameKeys = DATA.map(r => keyOf(r[2]))

function keyOf(s) {
  let o = ''
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i)
    if (c >= 97 && c <= 122) o += String.fromCharCode(c - 32)
    else if ((c >= 65 && c <= 90) || (c >= 48 && c <= 57)) o += s[i]
  }
  return o
}

function repair(t) {
  if (!t || NUMS.has(t)) return t
  for (let i = 0; i < t.length; i++) {
    const c = SWAP[t[i]]
    if (c && NUMS.has(t.slice(0, i) + c + t.slice(i + 1))) return t.slice(0, i) + c + t.slice(i + 1)
  }
  for (let i = 0; i < t.length; i++) {
    for (let j = i + 1; j < t.length; j++) {
      const a = SWAP[t[i]], b = SWAP[t[j]]
      if (!a || !b) continue
      const cand = t.slice(0, i) + a + t.slice(i + 1, j) + b + t.slice(j + 1)
      if (NUMS.has(cand)) return cand
    }
  }
  return t
}

const rate = () => (parseFloat(fx.value) > 0 ? parseFloat(fx.value) : 0)
const yen = e => (rate() ? Math.round(e * rate()) : null)
const fy = n => (n == null ? '' : '¥' + n.toLocaleString())
const eur = v => v == null ? '—'
  : '€' + (v >= 1000 ? Math.round(v).toLocaleString('en-GB')
    : v >= 100 ? v.toFixed(0) : v.toFixed(2))
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function group(indices) {
  const by = new Map()
  for (const i of indices) {
    const r = DATA[i]
    let c = by.get(r[0])
    if (!c) { c = { num: r[0], name: r[2], runs: [], byNum: false }; by.set(r[0], c) }
    c.runs.push(r)
  }
  for (const c of by.values()) {
    c.runs.sort((a, b) => b[3] - a[3])
    c.hi = c.runs[0][3]
    c.lo = c.runs[c.runs.length - 1][3]
  }
  return [...by.values()]
}

let topCache = null
function topByValue() {
  if (!topCache) {
    topCache = group(DATA.map((_, i) => i)).sort((a, b) => b.hi - a.hi)
  }
  return topCache
}

function search(t) {
  const hitNum = [], hitName = []
  for (let i = 0; i < DATA.length; i++) {
    if (DATA[i][1].includes(t)) hitNum.push(i)
    else if (t.length >= 3 && nameKeys[i].includes(t)) hitName.push(i)
  }
  const byNum = group(hitNum).sort((a, b) => b.hi - a.hi)
  byNum.forEach(c => { c.byNum = true })
  const byName = group(hitName).sort((a, b) => b.hi - a.hi)
  const seen = new Set(byNum.map(c => c.num))
  return byNum.concat(byName.filter(c => !seen.has(c.num)))
}

function render() {
  const raw = keyOf(q.value.trim())
  const t = repair(raw)
  if (!t) return paint(topByValue(), 'Top cards by value. Search by number or name.', false)
  const cards = search(t)
  if (!cards.length) {
    out.innerHTML = `<p class="empty">Nothing matches <b>${esc(q.value)}</b>.<br>Check the number on the card, or try the character's name.</p>`
    return
  }
  paint(cards, t !== raw ? `Matched <b>${esc(t)}</b>` : null)
}

function paint(cards, note, detail = true) {
  const paid = parseFloat(tag.value) > 0 ? parseFloat(tag.value) : null
  const show = cards.slice(0, 30)
  let h = note ? `<p class="note">${note}</p>` : ''

  for (const c of show) {
    h += '<article class="card">'
      + `<a class="top" target="_blank" rel="noopener" href="${SEARCH_URL}${encodeURIComponent(c.num)}">`
      + `<span class="id"><span class="num">${c.num}</span><span class="name">${esc(c.name)}</span></span>`
      + `<span class="val"><span class="yen tab">${fy(yen(c.hi))}</span><span class="eur tab">${eur(c.hi)}</span></span>`
      + '</a>'

    const runs = detail ? c.runs.slice(0, 5) : []
    if (runs.length > 1) {
      h += '<div class="runs">'
      for (const r of runs) {
        const v = yen(r[3])
        let m = ''
        if (paid && v != null) {
          const d = Math.round(v * FEE - paid)
          m = `<span class="margin tab ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : '−'}¥${Math.abs(d).toLocaleString()}</span>`
        }
        h += `<div class="run"><span class="code">${r[6] ? esc(r[6]) : '·'}</span>`
          + `<span class="rv tab">${fy(v)}</span><span class="re tab">${eur(r[3])}</span>${m}</div>`
      }
      h += '</div>'
    } else if (detail && paid) {
      const v = yen(c.hi)
      const d = v == null ? null : Math.round(v * FEE - paid)
      if (d != null) h += `<div class="runs"><div class="run"><span class="code">${c.runs[0][6] ? esc(c.runs[0][6]) : '·'}</span>`
        + `<span class="rv tab">${fy(v)}</span><span class="re tab">${eur(c.hi)}</span>`
        + `<span class="margin tab ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : '−'}¥${Math.abs(d).toLocaleString()}</span></div></div>`
    }

    if (c.runs.length > 1) {
      const hidden = detail && c.runs.length > runs.length ? `, ${c.runs.length - runs.length} cheaper not shown` : ''
      const how = detail ? ' Tap to see which is yours.' : ''
      h += `<p class="only">${c.runs.length} printings, ${eur(c.lo)} to ${eur(c.hi)}${hidden}.${how}</p>`
    }
    h += '</article>'
  }

  if (cards.length > show.length) h += `<p class="more">${cards.length - show.length} more. Keep typing to narrow.</p>`
  out.innerHTML = h
}

try { const saved = localStorage.getItem('fx'); if (saved) fx.value = saved } catch {}
fx.addEventListener('change', () => { try { localStorage.setItem('fx', fx.value) } catch {} ; render() })
q.addEventListener('input', render)
tag.addEventListener('input', render)
render()

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})

</script>
</body>
</html>
